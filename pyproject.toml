[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nordbastion-mcp"
version = "0.1.0"
description = "MCP server for NordBastion — provision KYC-free, crypto-paid Nordic VPS & dedicated servers from any AI agent (Claude, Cursor, …)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NordBastion" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "nordbastion",
    "vps",
    "kyc-free",
    "no-kyc",
    "anonymous-hosting",
    "crypto-vps",
    "monero-vps",
    "bitcoin-vps",
    "claude",
    "ai-agents",
    "devops",
    "hosting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://nordbastion.com"
"API reference" = "https://nordbastion.com/api/"
Repository = "https://github.com/CryptoServers/nordbastion-mcp"
Issues = "https://github.com/CryptoServers/nordbastion-mcp/issues"

[project.scripts]
nordbastion-mcp = "nordbastion_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nordbastion_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/nordbastion_mcp", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
